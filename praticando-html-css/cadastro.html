<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Cadastro</title>
</head>
<body>

      <main>

        <section class="sessao-imagem">
            <img src="img/imagem-fundo.png" alt="Casal numa livraria" width="375px" border-radius="5px">
        </section>
        
        <section class="sessao-login">
            <div class="area-titulo titulo-cadastro">
                <h1> <span>Kings</span>onBooks </div> </h1>
                <h2> Faça seu cadastro</h2>
            </div>

            <form action="#" method="post" id="form-cadastro">
                
                <label for="nome"> Nome:</label>
                <input type="text" id="nome" placeholder="Informe seu nome">
                
                <label for="email"> Email:</label>
                <input type="text" id="email" placeholder="Informe seu email">

                <label for="usuario"> Usuário:</label>
                <input type="text" id="usuario" placeholder="Informe seu usuario">

                <div class="cadastro-senha">
                    
                    <div>
                        <label for="senha"> Senha:</label>
                        <input type="text" id="senha" placeholder="Informe sua senha">
                    </div>
                    
                    <div>
                        <label for="senha"> Confirma Senha:</label>
                        <input type="text" id="confirmar-senha" placeholder="Confirmar senha">
                    </div>
                </div>

                <button id="btn-acessar" > Cadastrar-se </button>
                <a href="login.html" id="ja-possuo-conta"> Já possuo conta. Acessar agora!</a>
                
            </form>

        </section>

    </main>

</body>
</html>
