<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <script defer src="/login.js"></script>
    <title>Área de Login</title>
    <title>Login</title>
</head>
<body>

    <main>

        <section class="sessao-imagem">
            <img src="../img/imagem-fundo.png" alt="Casal numa livraria" >
        </section>
        
        <section class="sessao-login">
            <div class="area-titulo">
                <h1> <span>Kings</span>onBooks </div> </h1>
                <h2> Troque livros, multiplique histórias</h2>
            </div>

            <form  id="form-login">

                <label for="email"> Usuário ou Email:</label>
                <input type="email" id="email" placeholder="Informe seu email">

                <label for="senha"> Senha:</label>
                <input type="password" id="senha" placeholder="Informe sua senha">

                <div class="links-senha">
                    <input type="checkbox" id="lembrar-senha">
                    <label for="lembrar-senha"> Lembrar senha </label>

                    <a href="#" id="link-esqueceu-senha"> Esqueceu senha? </a>
                </div>

                <label id="msg-login"></label>

                <button type="submit" > Acessar </button>
                <a href="cadastro.html" id="nao-possui-conta"> Ainda não pussuo uma conta</a>
                
            </form>

        </section>

    </main>
    
</body>
</html>
